name: Ship callrack-api

# Manual only, on purpose - mirrors the existing rule in ci.yml that no
# push or pull_request can ever trigger a deployment. This pipeline builds,
# publishes, and promotes in one run, so keeping the trigger manual is the
# single biggest safety property it has.
on:
  workflow_dispatch: {}

env:
  IMAGE_REPO: ghcr.io/leleonardleo4/callrack

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------
  # Quality gate. Independent of ci.yml (which already runs this on every
  # push/PR to main) - re-checked here too because this workflow can be
  # dispatched against any ref, not only a ref ci.yml has already vetted.
  # ---------------------------------------------------------------------
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: callrack
          POSTGRES_PASSWORD: callrack_dev_password
          POSTGRES_DB: callrack_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U callrack -d callrack_dev"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://callrack:callrack_dev_password@localhost:5432/callrack_dev?schema=public
      REDIS_URL: redis://localhost:6379
    outputs:
      release_ref: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 11.15.1 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      # Strict on purpose: this pipeline is validating (and about to ship)
      # the exact dependency graph the lockfile describes. `=false` here
      # would silently let a drifted lockfile through.
      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @callrack/db run db:generate

      - name: Apply schema to the CI database
        run: pnpm --filter @callrack/db run db:migrate:deploy

      - name: Static checks (lint + typecheck)
        run: |
          pnpm lint
          pnpm typecheck

      - name: Test suite
        run: pnpm test

      # No `pnpm build` here on purpose: apps/api/Dockerfile's own `assemble`
      # stage is the only compilation whose output actually ships (via
      # `forge` below), and `nest build` uses the default tsc builder (no
      # `builder: "swc"` in apps/api/nest-cli.json) - meaning it type-checks
      # on top of emitting, which `pnpm typecheck` above has already done.
      # Running it here a second time would recompile the same source into
      # output nothing downstream reads, just to duplicate a check that
      # already ran.
      - name: Derive the release tag for this run
        id: tag
        run: echo "value=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # One job per image (not per image x arch). apps/api/Dockerfile pins its
  # install/compile stages to $BUILDPLATFORM, so that work only has a
  # reason to run once per image regardless of how many target platforms
  # are requested; asking buildx for both platforms in the same invocation
  # (rather than one job per arch, each redoing that work from zero on its
  # own runner) is what actually collects that saving. `runtime`'s stage
  # graph is the expensive one (pnpm install, prisma generate, nest build);
  # `migrator`'s (`migrator-deps`) is deliberately cheaper - a plain install
  # scoped to @callrack/db alone, no generate, no Nest build, since
  # `prisma migrate deploy` needs neither. Only the final COPY-only stage
  # runs twice, once per arch, which costs seconds even under QEMU since
  # nothing there is compiled. Pushing straight to a single multi-platform
  # tag also means there's no separate manifest-list to stitch together
  # afterwards - buildx does that as part of `push: true` here.
  #
  # `cache-from`/`cache-to: type=gha` (scoped per image so `runtime` and
  # `migrator` can never overwrite each other's cache) is what actually
  # persists layers across separate runs of this workflow - GitHub Actions
  # gives every job a fresh runner VM, so the Dockerfile's own
  # `--mount=type=cache` pnpm store mount has no cross-run effect here; it
  # only helps someone iterating on `docker build` locally, where the same
  # daemon's cache survives between invocations.
  # ---------------------------------------------------------------------
  forge:
    name: Forge ${{ matrix.image }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [runtime, migrator]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }} (amd64 + arm64 in one manifest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=callrack-${{ matrix.image }}
          cache-to: type=gha,scope=callrack-${{ matrix.image }},mode=max
          tags: ${{ env.IMAGE_REPO }}:${{ matrix.image }}-${{ needs.preflight.outputs.release_ref }}

  # ---------------------------------------------------------------------
  # `forge` already pushed one multi-arch tag per image - nothing left to
  # stitch. This only double-checks both architectures actually landed in
  # it before `rollout` is allowed to pull it onto the edge VM.
  # ---------------------------------------------------------------------
  publish:
    name: Verify multi-arch manifests
    needs: [preflight, forge]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm both architectures landed in each tag
        run: |
          set -euo pipefail
          ref="${{ needs.preflight.outputs.release_ref }}"
          for image in runtime migrator; do
            report=$(docker buildx imagetools inspect "${IMAGE_REPO}:${image}-${ref}")
            echo "$report"
            echo "$report" | grep -q 'linux/amd64'
            echo "$report" | grep -q 'linux/arm64'
          done

  # ---------------------------------------------------------------------
  # Gated by the `production` GitHub Environment - configure required
  # reviewers there so promoting to the real VM always needs a human
  # sign-off, on top of this whole workflow already being dispatch-only.
  # ---------------------------------------------------------------------
  rollout:
    name: Roll out to the edge VM
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Stage the SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EDGE_SSH_KEY }}" > ~/.ssh/edge_key
          chmod 600 ~/.ssh/edge_key

      # promote.sh lives in this repo, not on the VM - nothing before this
      # ever put it there, which is why the first deploy failed with
      # "No such file or directory". Synced on every run (not just once)
      # so a change to promote.sh itself takes effect on the next dispatch
      # without a separate manual step.
      - name: Sync promote.sh onto the edge VM
        run: |
          set -euo pipefail
          scp -i ~/.ssh/edge_key \
            -o StrictHostKeyChecking=accept-new \
            deploy/promote.sh \
            "${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }}:/opt/apps/callrack/promote.sh"
          ssh -i ~/.ssh/edge_key \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }}" \
            "chmod 700 /opt/apps/callrack/promote.sh"

      - name: Promote ${{ needs.preflight.outputs.release_ref }} on the edge VM
        env:
          REF: ${{ needs.preflight.outputs.release_ref }}
          ACTOR: ${{ secrets.REGISTRY_ACTOR }}
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n%s\n' "$ACTOR" "$TOKEN" | ssh \
            -i ~/.ssh/edge_key \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }}" \
            "/opt/apps/callrack/promote.sh '$REF'"

      - name: Remove the staged key regardless of outcome
        if: always()
        run: rm -f ~/.ssh/edge_key
