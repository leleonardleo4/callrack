name: Ship callrack-api

# Manual only, on purpose - mirrors the existing rule in ci.yml that no
# push or pull_request can ever trigger a deployment. This pipeline builds,
# publishes, and promotes in one run, so keeping the trigger manual is the
# single biggest safety property it has.
on:
  workflow_dispatch: {}

env:
  IMAGE_REPO: ghcr.io/leleonardleo4/callrack

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------
  # Quality gate. Independent of ci.yml (which already runs this on every
  # push/PR to main) - re-checked here too because this workflow can be
  # dispatched against any ref, not only a ref ci.yml has already vetted.
  # ---------------------------------------------------------------------
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: callrack
          POSTGRES_PASSWORD: callrack_dev_password
          POSTGRES_DB: callrack_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U callrack -d callrack_dev"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://callrack:callrack_dev_password@localhost:5432/callrack_dev?schema=public
      REDIS_URL: redis://localhost:6379
    outputs:
      release_ref: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 11.15.1 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Install workspace
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm --filter @callrack/db run db:generate

      - name: Apply schema to the CI database
        run: pnpm --filter @callrack/db run db:migrate:deploy

      - name: Static checks (lint + typecheck)
        run: |
          pnpm lint
          pnpm typecheck

      - name: Test suite
        run: pnpm test

      - name: Compile every workspace target
        run: pnpm build

      - name: Derive the release tag for this run
        id: tag
        run: echo "value=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # One matrix cell per (image, cpu architecture) pair. Building each arch
  # in its own job - instead of one `docker buildx build --platform a,b`
  # invocation - means an arm64 failure surfaces on its own line and never
  # blocks the amd64 artifact (or vice versa) from finishing and being
  # available for inspection.
  # ---------------------------------------------------------------------
  forge:
    name: Forge ${{ matrix.image }} / ${{ matrix.cpu }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [runtime, migrator]
        cpu: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the ${{ matrix.cpu }} layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.cpu }}
          push: true
          tags: >-
            ${{ env.IMAGE_REPO }}:${{ matrix.image }}-${{ needs.preflight.outputs.release_ref }}-${{ matrix.cpu }}

  # ---------------------------------------------------------------------
  # Stitches each image's two per-arch tags into one multi-arch manifest,
  # which is the reference the server's own promote.sh actually asks for.
  # ---------------------------------------------------------------------
  publish:
    name: Publish multi-arch manifests
    needs: [preflight, forge]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine per-arch layers into one tag, per image
        run: |
          set -euo pipefail
          ref="${{ needs.preflight.outputs.release_ref }}"
          for image in runtime migrator; do
            docker buildx imagetools create \
              --tag "${IMAGE_REPO}:${image}-${ref}" \
              "${IMAGE_REPO}:${image}-${ref}-amd64" \
              "${IMAGE_REPO}:${image}-${ref}-arm64"
          done

      - name: Confirm both architectures actually landed in the manifest
        run: |
          set -euo pipefail
          ref="${{ needs.preflight.outputs.release_ref }}"
          for image in runtime migrator; do
            report=$(docker buildx imagetools inspect "${IMAGE_REPO}:${image}-${ref}")
            echo "$report"
            echo "$report" | grep -q 'linux/amd64'
            echo "$report" | grep -q 'linux/arm64'
          done

  # ---------------------------------------------------------------------
  # Gated by the `production` GitHub Environment - configure required
  # reviewers there so promoting to the real VM always needs a human
  # sign-off, on top of this whole workflow already being dispatch-only.
  # ---------------------------------------------------------------------
  rollout:
    name: Roll out to the edge VM
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Stage the SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EDGE_SSH_KEY }}" > ~/.ssh/edge_key
          chmod 600 ~/.ssh/edge_key

      - name: Promote ${{ needs.preflight.outputs.release_ref }} on the edge VM
        env:
          REF: ${{ needs.preflight.outputs.release_ref }}
          ACTOR: ${{ secrets.REGISTRY_ACTOR }}
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n%s\n' "$ACTOR" "$TOKEN" | ssh \
            -i ~/.ssh/edge_key \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.EDGE_USER }}@${{ secrets.EDGE_HOST }}" \
            "/opt/apps/callrack/promote.sh '$REF'"

      - name: Remove the staged key regardless of outcome
        if: always()
        run: rm -f ~/.ssh/edge_key
