name: Callrack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Deployment is never automatic — see the `deploy` job below. It only
  # exists as a manually-triggered workflow_dispatch target, never on push
  # or pull_request, so a routine merge can never deploy anything, let
  # alone with Mainnet configuration.
  workflow_dispatch:
    inputs:
      target:
        description: 'Environment to deploy (must match a configured GitHub Environment with its own secrets/protection rules)'
        type: choice
        options: [testnet, production]
        required: true

jobs:
  verify:
    name: Verify Monorepo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: callrack
          POSTGRES_PASSWORD: callrack_dev_password
          POSTGRES_DB: callrack_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callrack -d callrack_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://callrack:callrack_dev_password@localhost:5432/callrack_dev?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client
        run: pnpm --filter @callrack/db run db:generate

      - name: Apply database migrations
        run: pnpm --filter @callrack/db run db:migrate:deploy

      - name: Run Linting
        run: pnpm lint

      - name: Run Type Checking
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Run Production Build
        run: pnpm build

  docker-build:
    name: Build production API image
    runs-on: ubuntu-latest
    needs: verify
    # Runs on every push/PR too (build-only, no push/registry credentials
    # needed) so a Dockerfile regression is caught before merge, not
    # discovered at deploy time.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build apps/api production image
        run: docker build -f apps/api/Dockerfile -t callrack-api:ci .

  deploy:
    name: Deploy (manual, environment-gated)
    runs-on: ubuntu-latest
    needs: [verify, docker-build]
    if: github.event_name == 'workflow_dispatch'
    # Binds to a GitHub Environment named "testnet" or "production" — each
    # must be configured in the repo's Settings → Environments with its own
    # secrets (DATABASE_URL, REDIS_URL, MAINNET_PAY_TO, etc. — see
    # docs/DEPLOYMENT.md) and, for `production`, required reviewers so a
    # Mainnet deploy needs an explicit human approval every time, not just
    # picking the right dropdown option.
    environment: ${{ inputs.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "No hosting platform has been selected for Callrack yet (see docs/DEPLOYMENT.md)."
          echo "This job intentionally stops here rather than fabricate a deploy step for a"
          echo "platform this repository isn't actually wired to. Replace this step with the"
          echo "chosen host's real deploy command (and its migration-release step — see"
          echo "docs/DEPLOYMENT.md's 'Database migration deployment' section) before this"
          echo "workflow_dispatch target is used for a real deployment."
          exit 1
